<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Channel Lattice banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e8b04b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- D2Q9 stencil -->
  <g transform="translate(90,45)">
    <!-- grid hint -->
    <g stroke="#132a45" stroke-width="1">
      <line x1="0" y1="0" x2="200" y2="0"/><line x1="0" y1="52" x2="200" y2="52"/><line x1="0" y1="104" x2="200" y2="104"/><line x1="0" y1="156" x2="200" y2="156"/><line x1="0" y1="208" x2="200" y2="208"/>
      <line x1="0" y1="0" x2="0" y2="208"/><line x1="50" y1="0" x2="50" y2="208"/><line x1="100" y1="0" x2="100" y2="208"/><line x1="150" y1="0" x2="150" y2="208"/><line x1="200" y1="0" x2="200" y2="208"/>
    </g>
    <!-- 8 velocity links from center 100,104 -->
    <g stroke="#4fc3f7" stroke-width="2.5">
      <line x1="100" y1="104" x2="152" y2="104" marker-end="url(#arr)"/>
      <line x1="100" y1="104" x2="48" y2="104"/>
      <line x1="100" y1="104" x2="100" y2="52" marker-end="url(#arr)"/>
      <line x1="100" y1="104" x2="100" y2="156"/>
      <line x1="100" y1="104" x2="146" y2="58" marker-end="url(#arr)"/>
      <line x1="100" y1="104" x2="54" y2="58"/>
      <line x1="100" y1="104" x2="146" y2="150" marker-end="url(#arr)"/>
      <line x1="100" y1="104" x2="54" y2="150"/>
    </g>
    <circle cx="100" cy="104" r="11" fill="#e8b04b"/>
    <text x="36" y="240" fill="#9fb8ce" font-family="Consolas, monospace" font-size="16">D2Q9 · w = 4/9, 1/9, 1/36</text>
  </g>
  <!-- emerging parabolic profile between walls -->
  <g transform="translate(370,55)">
    <line x1="0" y1="10" x2="0" y2="190" stroke="#8fb8d8" stroke-width="5"/>
    <line x1="0" y1="200" x2="200" y2="200" stroke="#8fb8d8" stroke-width="5"/>
    <line x1="0" y1="190" x2="0" y2="10" stroke="#8fb8d8" stroke-width="0"/>
    <path d="M 2 190 Q 100 -20 198 190" fill="none" stroke="#4fc3f7" stroke-width="5"/>
    <path d="M 2 190 Q 100 60 198 190" fill="none" stroke="#e8b04b" stroke-width="2.5" stroke-dasharray="7 5"/>
    <line x1="100" y1="190" x2="100" y2="8" stroke="#5b7a99" stroke-width="1.5" marker-end="url(#arrg)"/>
    <text x="18" y="30" fill="#9fb8ce" font-family="Consolas, monospace" font-size="14">u(y) = (g/2ν)(y−y₀)(y₁−y)</text>
    <text x="112" y="60" fill="#7fd1f0" font-family="Consolas, monospace" font-size="13">computed</text>
    <text x="112" y="82" fill="#e8b04b" font-family="Consolas, monospace" font-size="13">analytic</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="620" y="120" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="1">Channel <tspan fill="#4fc3f7">Lattice</tspan></text>
    <text x="622" y="163" fill="#9fb8ce" font-size="21">D2Q9 channel flow from lattice to continuum</text>
    <text x="622" y="201" fill="#5b7a99" font-family="Consolas, monospace" font-size="15">BGK · Guo forcing · half-way bounce-back</text>
  </g>
</svg>
