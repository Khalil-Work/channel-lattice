[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-lattice"
version = "1.0.0"
description = "D2Q9 lattice-Boltzmann solver for plane Poiseuille channel flow, verified against the analytic parabolic profile"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MOHAMMED AHMED" }]
keywords = ["lattice-boltzmann", "d2q9", "fluid-dynamics", "poiseuille", "verification"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy==2.1.3",
    "matplotlib==3.10.0",
    "pillow==11.0.0",
]

[tool.setuptools]
packages = ["channel_lattice"]
